<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // GitHub Pages serves this file for unknown paths. The app routes by
      // hash (#/contribute), so rewrite the path to a hash route and reload.
      // Assumes the site is served from the domain root (BASE_PATH='/').
      location.replace('/#' + location.pathname)
    </script>
  </head>
  <body></body>
</html>
